[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "professional-network-toolkit"
version = "1.1.0"
description = "Professional IPv4 VLSM calculator and network engineering toolkit extension"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
network-vlsm = "network_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["network_toolkit*"]
